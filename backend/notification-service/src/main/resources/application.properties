spring.application.name=notification-service
server.port=8086

# Database (for idempotency tracking)
spring.datasource.url=jdbc:postgresql://localhost:5432/blooms_notification
spring.datasource.username=root1
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Dead-letter topic configuration
spring.kafka.consumer.dlt.topic-name=order-created-dlt

# Email Configuration
# MOCK MODE (default for college project - logs to console, no real email sent)
notification.email.mock=true

