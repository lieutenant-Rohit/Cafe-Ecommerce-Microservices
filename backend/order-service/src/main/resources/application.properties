spring.application.name=order-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/blooms_order
spring.datasource.username=root1
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=localhost:9092

# Outbox scheduler configuration
outbox.scheduler.enabled=true
outbox.scheduler.poll-interval-ms=5000
outbox.max-attempts=5

# External service URLs
catalog.service.url=http://localhost:8082
inventory.service.url=http://localhost:8085
cart.service.url=http://localhost:8083
user.service.url=http://localhost:8081