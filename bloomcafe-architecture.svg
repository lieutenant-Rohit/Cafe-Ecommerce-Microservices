<svg viewBox="0 0 1280 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#f8fafc"/>

  <!-- Title -->
  <text x="640" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">BloomCafeV2 — System Architecture</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#64748b">Microservices backend (Java 21 / Spring Boot) + React SPA frontend</text>

  <!-- Frontend -->
  <rect x="440" y="80" width="400" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="640" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Frontend</text>
  <text x="640" y="128" text-anchor="middle" font-size="11" fill="#3b5273">React 18 + TypeScript · Nginx · :3100</text>

  <!-- Arrow Frontend -> Gateway -->
  <line x1="640" y1="150" x2="640" y2="188" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow-slate)"/>
  <text x="655" y="173" font-size="11" fill="#64748b">/api/*</text>

  <!-- Gateway -->
  <rect x="440" y="190" width="400" height="70" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="640" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">API Gateway (Nginx)</text>
  <text x="640" y="238" text-anchor="middle" font-size="11" fill="#5b21b6">CORS · Routing · JWT verification · :8180</text>

  <!-- Stem + bus -->
  <line x1="640" y1="260" x2="640" y2="300" stroke="#475569" stroke-width="1.5"/>
  <line x1="170" y1="300" x2="1110" y2="300" stroke="#475569" stroke-width="1.5"/>
  <line x1="170" y1="300" x2="170" y2="328" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="405" y1="300" x2="405" y2="328" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="640" y1="300" x2="640" y2="328" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="875" y1="300" x2="875" y2="328" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="1110" y1="300" x2="1110" y2="328" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- Service boxes -->
  <rect x="65" y="330" width="210" height="100" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="170" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">User Service</text>
  <text x="170" y="388" text-anchor="middle" font-size="11" fill="#0f766e">:8081</text>
  <text x="170" y="405" text-anchor="middle" font-size="11" fill="#0f766e">Auth · JWT · Users</text>

  <rect x="300" y="330" width="210" height="100" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="405" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Catalog Service</text>
  <text x="405" y="388" text-anchor="middle" font-size="11" fill="#0f766e">:8082</text>
  <text x="405" y="405" text-anchor="middle" font-size="11" fill="#0f766e">Products · Categories</text>

  <rect x="535" y="330" width="210" height="100" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="640" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Cart Service</text>
  <text x="640" y="388" text-anchor="middle" font-size="11" fill="#0f766e">:8083</text>
  <text x="640" y="405" text-anchor="middle" font-size="11" fill="#0f766e">Shopping Cart</text>

  <rect x="770" y="330" width="210" height="100" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="875" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Order Service</text>
  <text x="875" y="388" text-anchor="middle" font-size="11" fill="#0f766e">:8084</text>
  <text x="875" y="405" text-anchor="middle" font-size="11" fill="#0f766e">Checkout Orchestration</text>

  <rect x="1005" y="330" width="210" height="100" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="1110" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Inventory Service</text>
  <text x="1110" y="388" text-anchor="middle" font-size="11" fill="#0f766e">:8085</text>
  <text x="1110" y="405" text-anchor="middle" font-size="11" fill="#0f766e">Stock Management</text>

  <!-- Cross-service calls -->
  <path d="M 620,430 Q 512,460 425,430" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <text x="512" y="452" text-anchor="middle" font-size="10" fill="#475569">REST · validate</text>

  <path d="M 800,430 Q 758,444 718,430" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <text x="758" y="440" text-anchor="middle" font-size="10" fill="#475569">REST · checkout</text>

  <path d="M 955,430 Q 992,444 1030,430" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <text x="992" y="440" text-anchor="middle" font-size="10" fill="#475569">REST · reserve stock</text>

  <path d="M 830,432 Q 787,478 745,432" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-orange)"/>
  <text x="787" y="472" text-anchor="middle" font-size="10" fill="#c2410c">Kafka · auto-clear</text>

  <line x1="405" y1="430" x2="405" y2="490" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <text x="418" y="463" font-size="10" fill="#475569">cache</text>

  <line x1="875" y1="430" x2="875" y2="490" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-orange)"/>
  <text x="888" y="463" font-size="10" fill="#c2410c">Kafka · order-created</text>

  <!-- Redis -->
  <rect x="300" y="490" width="210" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="405" y="518" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Redis Cache</text>
  <text x="405" y="538" text-anchor="middle" font-size="11" fill="#991b1b">Catalog reads · 10-min TTL</text>

  <!-- Notification -->
  <rect x="770" y="490" width="210" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="875" y="518" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Notification Service</text>
  <text x="875" y="538" text-anchor="middle" font-size="11" fill="#92400e">:8086 · Kafka + WebSocket</text>

  <!-- WebSocket arrow -->
  <path d="M 980,525 L 1250,525 L 1250,115 L 842,115" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <text x="1258" y="320" font-size="11" fill="#6d28d9" text-anchor="middle" transform="rotate(-90 1258 320)">WebSocket / STOMP — live order status</text>

  <!-- DB connectors -->
  <line x1="170" y1="430" x2="170" y2="608" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="405" y1="560" x2="405" y2="608" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="640" y1="430" x2="640" y2="608" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="875" y1="560" x2="875" y2="608" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="1110" y1="430" x2="1110" y2="608" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- PostgreSQL -->
  <rect x="90" y="610" width="1100" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="640" y="640" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">PostgreSQL — Database per Service</text>
  <text x="640" y="662" text-anchor="middle" font-size="11" fill="#475569">blooms_user · blooms_catalog · blooms_cart · blooms_order · blooms_inventory</text>

  <!-- Legend -->
  <rect x="90" y="730" width="1100" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  <text x="110" y="755" font-size="13" font-weight="700" fill="#0f172a">Legend</text>

  <line x1="110" y1="782" x2="170" y2="782" stroke="#475569" stroke-width="2"/>
  <text x="182" y="786" font-size="12" fill="#334155">REST — synchronous call</text>

  <line x1="110" y1="812" x2="170" y2="812" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="182" y="816" font-size="12" fill="#334155">Kafka — asynchronous event</text>

  <line x1="110" y1="842" x2="170" y2="842" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="182" y="846" font-size="12" fill="#334155">WebSocket / STOMP — real-time push</text>

</svg>
